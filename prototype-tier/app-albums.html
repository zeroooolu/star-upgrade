<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专辑列表 · 星球发行</title><link rel="stylesheet" href="app-shell.css"><style>
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}.head h1{margin:0;font-size:22px;color:#20232a}.head p{margin:6px 0 0;color:#8a909a;font-size:12px}.actions{display:flex;gap:9px}.quota{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px}.q{padding:15px 16px;border:1px solid #e5e8ee;border-radius:5px;background:#fafbfc}.qtop{display:flex;justify-content:space-between;gap:12px}.q span{color:#9096a0;font-size:11px}.q strong{color:#303744;font-size:13px}.bar{height:6px;margin-top:10px;border-radius:999px;background:#edf0f4;overflow:hidden}.bar i{display:block;height:100%;background:#5b73ff}.q small{display:block;margin-top:7px;color:#9aa0a8}.quota-note{margin:0 18px 18px;padding:10px 12px;border-radius:4px;background:#f7f9ff;color:#65708a;font-size:11px}.table-tools{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #edf0f4}.filters{display:flex;gap:8px}.filters button{height:30px;padding:0 11px;border:1px solid #e0e4eb;border-radius:4px;background:#fff;color:#666e79;font-size:11px}.filters button.active{color:#2448ff;border-color:#b8c5ff;background:#f8faff}.search{width:220px;height:32px;border:1px solid #dfe3ea;border-radius:4px;padding:0 10px}.album{display:grid;grid-template-columns:minmax(340px,1fr) 130px 130px 110px;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid #edf0f4}.cover{width:48px;height:48px;border-radius:5px;background:linear-gradient(135deg,#e8edff,#cfd9ff);display:grid;place-items:center;color:#2448ff;font-weight:700}.main{display:flex;align-items:center;gap:12px}.main strong{display:block;color:#343b46}.main span{display:block;margin-top:5px;color:#9197a1;font-size:11px}.cell{color:#68707b;font-size:12px}.status{height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;border-radius:999px;background:#edf7f1;color:#1e995c;font-size:10px}.status.review{background:#fff7e7;color:#936c20}.status.draft{background:#f1f3f6;color:#6f7680}.modal-mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,28,42,.32);z-index:80}.modal-mask.show{display:flex}.modal{width:560px;background:#fff;border-radius:8px;box-shadow:0 20px 60px rgba(20,28,42,.22)}.modal-head{padding:18px 20px;border-bottom:1px solid #e8ebf0}.modal-head strong{font-size:16px}.modal-body{padding:18px 20px}.modal-body label{display:block;margin:12px 0 6px;color:#555d67;font-size:12px}.modal-body input{width:100%;height:38px;border:1px solid #d8dde6;border-radius:4px;padding:0 10px}.check-box{margin-top:16px;padding:13px 14px;border-radius:5px;background:#f7f9ff;border:1px solid #dce3ff}.check-row{display:flex;justify-content:space-between;padding:5px 0;color:#5d6673;font-size:12px}.check-row b{color:#333b47}.check-result{margin-top:9px;padding-top:10px;border-top:1px solid #e4e9f5;color:#60708d;font-size:11px;line-height:18px}.check-result.warn{color:#8a6421}.check-result.block{color:#b64343}.modal-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid #e8ebf0}.foot-left{font-size:11px;color:#8b929d}.foot-actions{display:flex;gap:8px}.disabled{opacity:.45;pointer-events:none}
</style></head><body data-page="albums" data-title="专辑列表"><aside class="sidebar"></aside><header class="topbar"></header><main class="workspace"><div class="page"><div class="head"><div><h1>专辑列表</h1><p>管理发行内容；创建新发行时会自动检查当前合作方案额度。</p></div><div class="actions"><button class="btn-default" id="batchBtn">批量导入</button><button class="btn-primary" id="createBtn">创建专辑</button></div></div><section class="card"><div class="quota" id="quota"></div><div class="quota-note" id="quotaNote"></div></section><section class="card" style="margin-top:16px"><div class="table-tools"><div class="filters"><button class="active">全部 248</button><button>草稿 6</button><button>审核中 18</button><button>已上线 224</button></div><input class="search" placeholder="搜索专辑 / UPC"></div><div class="album"><div class="main"><div class="cover">夏</div><div><strong>未完成的夏天</strong><span>12 首 · UPC 697812340021</span></div></div><div class="cell">2026-09-05</div><div><span class="status review">审核中</span></div><div class="cell">查看详情</div></div><div class="album"><div class="main"><div class="cover">∞</div><div><strong>Endless Loop</strong><span>8 首 · UPC 697812340014</span></div></div><div class="cell">2026-08-22</div><div><span class="status">已上线</span></div><div class="cell">查看详情</div></div><div class="album"><div class="main"><div class="cover">夜</div><div><strong>深夜之后</strong><span>5 首 · 尚未申请 UPC</span></div></div><div class="cell">2026-09-10</div><div><span class="status draft">草稿</span></div><div class="cell">继续编辑</div></div><div class="album"><div class="main"><div class="cover">III</div><div><strong>Archive III</strong><span>20 首 · UPC 697812339994</span></div></div><div class="cell">2026-07-18</div><div><span class="status">已上线</span></div><div class="cell">查看详情</div></div></section></div></main>
<div class="modal-mask" id="mask"><div class="modal"><div class="modal-head"><strong>创建专辑</strong></div><div class="modal-body"><label>专辑名称</label><input id="albumName" value="新的发行"><label>本次包含歌曲数</label><input id="trackCount" type="number" min="1" value="8"><div class="check-box" id="checkBox"></div></div><div class="modal-foot"><div class="foot-left">额度只在提交发行时正式占用</div><div class="foot-actions"><button class="btn-default" id="cancel">取消</button><a class="btn-default" id="expandLink" href="capacity.html" style="display:none">去扩容</a><button class="btn-primary" id="continueBtn">继续创建</button></div></div></div></div>
<script src="app-shell.js"></script><script>
const base={basic:{catalog:[438,500],tracks:[86,100],releases:[37,50],batch:false},professional:{catalog:[12460,50000],tracks:[2214,3000],releases:[412,1000],batch:true},plus:{catalog:[186420,300000],tracks:[12800,25000],releases:[3100,6000],batch:true}};let tier='professional';const quota=document.getElementById('quota');const mask=document.getElementById('mask');function state(){const d=JSON.parse(JSON.stringify(base[tier]));const p=StarCapacity.get();if(tier!=='plus'){d.catalog[1]+=p.catalog*1000;d.tracks[1]+=p.release*100}return d}function render(t){tier=t;const d=state();quota.innerHTML=[['歌曲托管',d.catalog],['今年新增歌曲',d.tracks],['今年新增专辑',d.releases]].map(x=>{const p=Math.round(x[1][0]/x[1][1]*100),remain=x[1][1]-x[1][0];return `<div class="q"><div class="qtop"><span>${x[0]}</span><strong>${x[1][0].toLocaleString()} / ${x[1][1].toLocaleString()}</strong></div><div class="bar"><i style="width:${Math.min(100,p)}%"></i></div><small>剩余 ${Math.max(0,remain).toLocaleString()} · 已用 ${p}%</small></div>`}).join('');quotaNote.textContent=tier==='basic'?'Basic 使用标准创建流程；接近或超过年度额度时会提醒或阻止新的提交，已上线作品不受影响。':tier==='professional'?'Professional 可使用完整批量能力；额度接近上限时仍会按相同规则提醒。':'Plus 为定制容量，复杂或超大批量项目可由专属运营协调。';batchBtn.textContent=tier==='basic'?'批量导入 · Professional':'批量导入';batchBtn.classList.toggle('disabled',tier==='basic');check()}document.addEventListener('tierchange',e=>render(e.detail.tier));function check(){if(!mask.classList.contains('show'))return;const d=state(),n=Math.max(1,Number(trackCount.value)||1),remainTrack=d.tracks[1]-d.tracks[0],remainRelease=d.releases[1]-d.releases[0],remainCatalog=d.catalog[1]-d.catalog[0];let block='',warn='';if(tier!=='plus'){if(remainRelease<1)block='年度新增专辑额度已用完，请先联系服务中心处理额度。';else if(n>remainTrack)block=`本次需要 ${n} 首，但年度新增歌曲只剩 ${remainTrack} 首。`;else if(n>remainCatalog)block=`本次加入后将超过歌曲托管容量，当前只剩 ${remainCatalog} 首。`;else if((d.tracks[0]+n)/d.tracks[1]>=.8)warn=`提交后年度新增歌曲将使用 ${Math.round((d.tracks[0]+n)/d.tracks[1]*100)}%，可以继续，但建议提前关注扩容。`}checkBox.innerHTML=`<div class="check-row"><span>本次预计占用</span><b>${n} 首歌曲 + 1 个 Release</b></div><div class="check-row"><span>年度新增歌曲剩余</span><b>${tier==='plus'?'按合作配置':Math.max(0,remainTrack)+' 首'}</b></div><div class="check-row"><span>年度新增专辑剩余</span><b>${tier==='plus'?'按合作配置':Math.max(0,remainRelease)+' 个'}</b></div><div class="check-result ${block?'block':warn?'warn':''}">${block||warn||'额度充足，可以继续创建。发行所需 ISRC / UPC 将按额度规则提供。'}</div>`;continueBtn.classList.toggle('disabled',!!block);expandLink.style.display=block&&remainRelease>=1?'inline-flex':'none'}createBtn.onclick=()=>{mask.classList.add('show');check()};cancel.onclick=()=>mask.classList.remove('show');trackCount.oninput=check;continueBtn.onclick=()=>{if(continueBtn.classList.contains('disabled'))return;continueBtn.textContent='已进入编辑';setTimeout(()=>{continueBtn.textContent='继续创建';mask.classList.remove('show')},700)};batchBtn.onclick=()=>{if(tier==='basic')return;alert(tier==='plus'?'Demo：进入大批量发行工作台。':'Demo：进入 Professional 批量导入模板。')};render(localStorage.getItem('star-demo-tier')||'professional');
</script></body></html>
