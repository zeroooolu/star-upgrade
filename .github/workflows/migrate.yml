name: One-time product migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate Star Upgrade files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zeroooolu/kanjian-distribution-products.git /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/source/02-star-release/. .
          cp /tmp/source/07-decisions/star-release-revenue-share-policy-v1.0.md ./star-release-revenue-share-policy-v1.0.md
          cat > README.md <<'EOF'
          # 星球发行 Upgrade

          星球发行 Upgrade 独立产品仓库，由 `kanjian-distribution-products` 母仓拆分。

          ## 仓库内容

          - 商业模式与版本设计文档
          - 星球发行产品原型
          - 收益分成政策决策

          跨产品的总体架构、共享发行底座与跨产品决策继续维护在 `kanjian-distribution-products` 母仓。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate star upgrade from parent repository"
          git push origin HEAD:main
